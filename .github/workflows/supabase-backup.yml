name: Encrypted Supabase backup

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retorno-supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    name: Export and encrypt database and report images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_BACKUP_DATABASE_URL: ${{ secrets.SUPABASE_BACKUP_DATABASE_URL }}
      SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      SUPABASE_S3_ENDPOINT: ${{ vars.SUPABASE_S3_ENDPOINT }}
      SUPABASE_S3_REGION: ${{ vars.SUPABASE_S3_REGION }}
      SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
      AGE_RECIPIENT: ${{ vars.RETURNO_BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Check out backup tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_BACKUP_DATABASE_URL SUPABASE_S3_ACCESS_KEY_ID SUPABASE_S3_SECRET_ACCESS_KEY SUPABASE_S3_ENDPOINT SUPABASE_S3_REGION SUPABASE_STORAGE_BUCKET AGE_RECIPIENT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required backup configuration is missing: ${name}"
              exit 1
            fi
          done
          if [[ "$AGE_RECIPIENT" != age1* ]]; then
            echo "::error::RETURNO_BACKUP_AGE_RECIPIENT must be an age public recipient (age1...)."
            exit 1
          fi
          if [[ "$SUPABASE_S3_ENDPOINT" != https://* ]]; then
            echo "::error::SUPABASE_S3_ENDPOINT must use HTTPS."
            exit 1
          fi

      - name: Install backup utilities
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes age rclone

      - name: Install Supabase CLI
        shell: bash
        run: npx --yes supabase@3.0.0 --version

      - name: Export database and copy private Storage bucket
        shell: bash
        env:
          RCLONE_CONFIG_RETURNO_TYPE: s3
          RCLONE_CONFIG_RETURNO_PROVIDER: Other
          RCLONE_CONFIG_RETURNO_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_RETURNO_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_RETURNO_ENDPOINT: ${{ vars.SUPABASE_S3_ENDPOINT }}
          RCLONE_CONFIG_RETURNO_REGION: ${{ vars.SUPABASE_S3_REGION }}
          RCLONE_CONFIG_RETURNO_FORCE_PATH_STYLE: "true"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retorno-backup/storage"
          cd "$RUNNER_TEMP/retorno-backup"

          # Keep CLI diagnostics out of logs because connection errors may contain a URL.
          if ! npx --yes supabase@3.0.0 db dump --remote="$SUPABASE_BACKUP_DATABASE_URL" -f roles.sql --role-only > "$RUNNER_TEMP/roles.log" 2>&1; then
            echo "::error::Database roles export failed. Check the session-pooler connection secret."
            exit 1
          fi
          if ! npx --yes supabase@3.0.0 db dump --remote="$SUPABASE_BACKUP_DATABASE_URL" -f schema.sql > "$RUNNER_TEMP/schema.log" 2>&1; then
            echo "::error::Database schema export failed. Check the session-pooler connection secret."
            exit 1
          fi
          if ! npx --yes supabase@3.0.0 db dump --remote="$SUPABASE_BACKUP_DATABASE_URL" -f data.sql --use-copy --data-only -x storage.buckets_vectors -x storage.vector_indexes > "$RUNNER_TEMP/data.log" 2>&1; then
            echo "::error::Database data export failed. Check the session-pooler connection secret."
            exit 1
          fi
          for file in roles.sql schema.sql data.sql; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Database export is empty: $file"
              exit 1
            fi
          done

          if ! rclone copy "retorno:${SUPABASE_STORAGE_BUCKET}" "$RUNNER_TEMP/retorno-backup/storage" --create-empty-src-dirs --log-level ERROR > "$RUNNER_TEMP/storage.log" 2>&1; then
            echo "::error::Private Storage export failed. Check the Supabase S3 endpoint and access keys."
            exit 1
          fi

          printf 'created_at_utc=%s\n' "$(date -u +%FT%TZ)" > MANIFEST.txt
          printf 'storage_object_count=%s\n' "$(find storage -type f | wc -l | tr -d ' ')" >> MANIFEST.txt
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          tar -czf "$RUNNER_TEMP/retorno-backup.tar.gz" -C "$RUNNER_TEMP" retorno-backup
          age --encrypt --recipient "$AGE_RECIPIENT" --output "$RUNNER_TEMP/retorno-backup.tar.gz.age" "$RUNNER_TEMP/retorno-backup.tar.gz"
          (cd "$RUNNER_TEMP" && sha256sum retorno-backup.tar.gz.age > retorno-backup.tar.gz.age.sha256)
          rm -rf "$RUNNER_TEMP/retorno-backup" "$RUNNER_TEMP/retorno-backup.tar.gz"

      - name: Store encrypted backup for 30 days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retorno-encrypted-backup-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/retorno-backup.tar.gz.age
            ${{ runner.temp }}/retorno-backup.tar.gz.age.sha256
          if-no-files-found: error
          retention-days: 30
